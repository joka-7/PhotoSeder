name: Bug
description: Something is broken or behaves wrongly
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: What's wrong?
      description: One or two sentences.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include the error message, traceback or log if you have one.
      render: shell
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Hints / constraints (optional)
      description: Suspected file or module, things not to touch, how to verify the fix.
